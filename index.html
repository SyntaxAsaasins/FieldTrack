<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#4f46e5">
<title>FieldTrack</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="FieldTrack"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#161a2b;--mu:#6b7285;--ac:#4f46e5;--ok:#16a34a;--er:#dc2626;--bd:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1f33;--tx:#eef0f8;--mu:#99a0b8;--bd:#2a3150}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1f33;--tx:#eef0f8;--mu:#99a0b8;--bd:#2a3150}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0 12px}select,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
.km{font-size:48px;font-weight:700;letter-spacing:-1px}.mu{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:14px;padding:15px;font:600 16px inherit;background:var(--ac);color:#fff;width:100%}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.ok{background:var(--ok)}button.er{background:var(--er)}button.big{padding:26px;font-size:20px}
.ban{background:#fef3c7;color:#78350f;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px}
.row{padding:10px 0;border-top:1px solid var(--bd);font-size:14px}.row:first-child{border:0}.row b{display:block}button:disabled{opacity:.38}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.sh{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
</style></head><body><div id="app"></div>

${D.start&&D.home?'<button class="s" id="rf">⛽ Refuel</button>':''}
<div class="card" style="margin-top:12px">${L.length?L.map((l,i)=>`<div class="row" data-l="${i}"><b>${l[0]} · ${hm(l[1].t)}</b><span class="mu">${l[1].a} ✎</span></div>`).join(''):'<span class="mu">No logs yet today.</span>'}</div>
<div class="g"><button id="dl">⬇ Download</button><button class="s" id="ac">＋ Activity</button><button class="s" id="hs">🗂 History</button><button class="s" id="sy">⟳ Sync</button><button class="s" id="se">⚙ Settings</button><button class="s" id="sw">Switch user</button></div>${dip?'<button id="ins" style="margin-top:10px">Install FieldTrack app</button>':''}`;
const b=(i,f)=>{const n=$('#'+i);if(n)n.onclick=f};b('st',start);b('vh',veh);b('ins',()=>dip&&dip.prompt());b('hs',showHist);b('sy',async()=>{if(!apiBase()){toast('Add the Apps Script URL in Settings first');return}toast('Syncing…');const H=hist();Object.keys(H).forEach(k=>H[k].start&&!H[k].test&&pushDay(k));await pull('2000-01-01','2999-12-31');render();toast('History synced')});b('hm',home);b('rf',refuel);b('dl',dl);b('ac',activity);b('se',settings);b('rt',()=>{if(!navigator.geolocation){gpsErr({code:9});return}navigator.geolocation.getCurrentPosition(()=>{gerr='';render();if(D.start&&!D.home)track()},gpsErr,{enableHighAccuracy:true,timeout:20000})});b('sw',()=>{S.me=null;S.e=-1;R=[];save();render()});
document.querySelectorAll('[data-s]').forEach(n=>n.onclick=()=>site(+n.dataset.s));document.querySelectorAll('[data-l]').forEach(n=>n.onclick=()=>editAddr(L[n.dataset.l][1]));paint()}
try{const u=new URLSearchParams(location.search).get('api');if(u&&/^https:\/\/script\.google\.com\//.test(u)){S.api=u;save();history.replaceState(null,'',location.pathname)}}catch(e){}
if(S.e>=0)mig();render();if(S.e>=0){resume();autopull()}
try{navigator.permissions.query({name:'geolocation'}).then(p=>{const f=()=>{if(p.state=='granted'){if(gerr){gerr='';render()}}else if(S.e>=0&&!gerr){gerr='Allow location so FieldTrack can record your trips.';render()}};f();p.onchange=f;if(p.state=='prompt'&&S.e>=0)retry()})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!='visible'||S.e<0)return;if(gerr)retry();resume()});
const later=()=>setTimeout(sync,Math.random()*3000),loop=()=>{sync();setTimeout(loop,20000+Math.random()*20000)};addEventListener('online',later);document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')later()});setTimeout(loop,Math.random()*3000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
